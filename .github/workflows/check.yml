name: Check repos

on:
  schedule:
    - cron: "17 19 * * *"   # 03:17 Beijing time, daily
  workflow_dispatch:         # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install zstandard
      - run: python scripts/check_repos.py
      - name: Commit results
        run: |
          git config user.name "repolist-bot"
          git config user.email "repolist-bot@users.noreply.github.com"
          git add status.json state.json
          git diff --cached --quiet || git commit -m "Update repo status"
          git push
